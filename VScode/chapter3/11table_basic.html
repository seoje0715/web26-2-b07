<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>11. table_basic / 12. table_cell</title>
</head>
<body>
    <!-- 테이블 태그
        1. table: 표 삽입
        2. tr: 표에 행 삽입(Table Row)
        3. th: 표에 제목 셀 생성(Table Heading)
        4. td: 표에 일반 셀 생성(Table Data) -->
    <table border="1"> <!-- border: 표 테두리 굵기 지정하는 속성 -->
        <thead> <!-- table의 속성(어떤 요소들의 상위 개념이면 모두 thead가 될 수 O) -->
            <tr>
                <th></th>
                <th>월</th>
                <th>화</th>
                <th>수</th>
                <th>목</th>
                <th>금</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1교시</td>
                <td>영어</td>
                <td>국어</td>
                <td>과학</td>
                <td>미술</td>
                <td>기술</td>
            </tr>
            <tr>
                <td>2교시</td>
                <td>도덕</td>
                <td>체육</td>
                <td>영어</td>
                <td>수학</td>
                <td>사회</td>
            </tr>
        </tbody>
        <!-- colspan: 셀의 너비를 지정하는 th&td의 속성
            rowspan: 셀의 높이를 지정하는 th&td의 속성 -->
    </table>

    <table border="1">
        <tr> <!-- 행 하나 만들어서 '지역별 홍차' 입력 -->
            <th colspan="2">지역별 홍차</th>
        </tr>
        <tr> <!-- 행 하나 더 만들어서 '중국(thead)', '정산소종(tbody)' 넣고 한 행에 2 요소 있어야 하기 때문에 밑으로 내려서 행 생성 -->
            <th rowspan="3">중국</th>
            <td>정산소종</td>
        </tr>
        <tr><td>기문</td></tr> <!-- 이미 중국이 3칸 중 2칸 차지했기 때문에 행 만들어서 '기문'만 입력하면 O -->
        <tr><td>운남</td></tr>
        <tr>
            <th rowspan="4">인도 및 스리랑카</th>
            <td>아삼</td>
        </tr>
        <tr><td>실론</td></tr>
        <tr> <td>다질링</td></tr>
        <tr><td>닐기리</td></tr>
    </table>
</body>
</html>

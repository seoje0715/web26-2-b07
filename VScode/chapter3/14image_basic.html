<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>14-18. 미디어 태그</title>
</head>
<body>
    <!-- 미디어 태그 
        1) img 태그 <img> (내용을 가질 수 없는 태그 -> 닫힘 태그 X)
            - 속성
                > src: 이미지의 경로 지정
                > alt: 이미지가 없을 때 나오는 글자 지정
                > width: 이미지의 너비 지정
                > height: 이미지의 높이 지정
        2) audio / video 태그 <audio></audio> <video></video> (내용을 가질 수 있는 태그)
            - 속성
                > src: 음악, 비디오 파일의 경로 지정
                > preload: 음악, 비디오를 준비 중일 때 데이터를 모두 불러올지 여부 지정
                > autoplay: 음악, 비디오의 자동 재생 여부 지정
                > loop: 음악, 비디오의 반복 여부 지정
                > controls: 음악, 비디오 재생 도구 출력 여부 지정
        3) video 태그 <video></video>
            - 속성
                > width: 비디오의 너비 지정
                > height: 비디오의 높이 지정 -->
    <h1>14. image_basic</h1>
    <img src="Penguins.jpg" alt="펭귄" width="300">
    <img src="Nothing" alt="그림이 존재하지 않습니다." width="300">

    <h1>15. audio_basic</h1>
    <audio src="Kalimba.mp3" controls="controls"></audio>

    <h1>16. audio_source</h1>
    <audio controls="controls">
        <!-- 웹 브라우저마다 지원하는 확장자 형식이 달라 실행됮 않을 수 O -> audio나 video 태그의 내부에 source 태그를 입력해 해결 가능
            type 속성을 입력하면 웹 브라우저가 음악 파일 다운 후 재생 가능한지 확인할 필요 X -->
        <source src="Kalimba.mp3" type="audio/mp3">
        <source src="Kalimba.ogg" type="audio/ogg">
    </audio>

    <h1>17. video_basic</h1>
    <video controls="controls">
        <source src="Wildlife.mp4" type="video/mp4">
        <source src="Wildlife.webm" type="video/webm">
    </video>

    <h1>18. video_poster</h1>
    <video controls="controls" poster="hanbit_logo.jpg">
        <!-- poster 속성: 동영상을 불러오는 동안 사용자에게 보여줄 이미지를 지정 -->
        <source src="Wildlife.mp4" type="video/mp4">
        <source src="Wildlife.webm" type="viedo/webm">
    </video>
</body>
</html>

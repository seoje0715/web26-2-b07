<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>8-9. 기본 목록 만들기 / 10. 중첩 목록 만들기</title>
</head>
<body>
    <h1>8. 순서가 없는 기본 목록</h1>
    <ul>
        <li>사과</li>
        <li>바나나</li>
        <li>오렌지</li>
    </ul>

    <h1>9. 순서가 있는 기본 목록</h1>
    <ol>
        <li>사과</li>
        <li>바나나</li>
        <li>오렌지</li>
    </ol>

    <h1>10. 중첩 목록 만들기</h1>
    <!-- 첫 번째 목록 -->
    <ul>
        <li>
            <b>과일</b>
            <ol>
                <li>사과</li>
                <li>바나나</li>
                <li>오렌지</li>
            </ol>
        </li>

    <!-- 두 번째 목록 -->
        <li>
            <b>채소</b>
            <ol>
                <li>상추</li>
                <li>치커리</li>
                <li>양배추</li>
            </ol>
        </li>
     </ul>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>4. 글자 속성(3)</title>
    <!-- 글자의 굴기와 기울기는 font-style과 font-weight 속성으로 조정
        font-style: 글자의 스타일(기울기 등) 지정
        font-weight: 글자 굵기 지정 -->
    <!-- text-align: 글자 정렬을 지정(span은 인라인 형태이므로 너비가 없기 때문에 text-align 속성을 적용할 수 없음.) -->
    <style>
        .font_big { font-size: 2em; }
        .font_italic { font-style: italic; }
        .font_bold { font-weight: bold; }
        .font_center { text-align: center; }
        .font_right { text-align: right; }
    </style>
</head>
<body>
    <p class="font_big font_italic font_bold font_center">Lorem ipsum dolor amet</p>
    <p class="font_bold font_right">2023.07.30</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Blanditiis aliquam esse asperiores laboriosam necessitatibus, quidem, exercitationem doloribus velit autem ducimus, veritatis et odio aperiam natus quas quod numquam similique? Nam.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1. 박스 속성(3)</title>
    <!-- 테두리 굵기: border-width 속성 사용
        테두리 형태: border-style 속성 사용
        테두리 색상: border-color 속성 사용
        테두리 둥글게: border-radius 속성 사용
        굵기, 형태, 색상 한 번에 지정도 가능 -> 'border: thick dashed black;'
        border 속성도 margin, padding 속성처럼 상하좌우 각각 입력 가능 -->
    <style>
        .box {
            border-width: thick;
            border-style: dashed;
            border-color: black;
            border-radius: 50px 40px 20px 10px; /* 왼위 오위 오밑 왼밑 */
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Newjeans is everywhere.</h1>
    </div>
</body>
</html>

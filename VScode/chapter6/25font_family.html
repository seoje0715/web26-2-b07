<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>4. 글자 속성(2)</title>
    <style>
        .font_arial { font-family: '없는 글꼴', Arial; } /* 사용자 컴퓨터에 설정한 글꼴이 없을 상황에 대비하여 여러 속성 입력 */
        .font_roman { font-family: 'Times New Roman', Arial; } /* 두 단어 이상으로 된 글꼴 이름은 따옴표 사용을 추천 */
        /* sans-serif, serif 글꼴을 사용할 때 인터넷 익스플로러를 사용한다면 '' 사용 X */
    </style>
</head>
<body>
    <h1 class="font_arial">Lorem ipsum</h1>
    <p class="font_roman">Lorem ipsum</p>
</body>
</html>

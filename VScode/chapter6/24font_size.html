<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>4. 글자 속성(1)</title>
    <!-- font-size 속성: 글자 크기 지정
        font-family 속성: 글꼴 지정
        다국적 웹 페이지 구성할 때는 각 언어의 글꼴을 전부 파악하기 어렵기 때문에 font-family 속성의 마지막에
        Serif(명조체), Sans-serif(고딕체), Mono space(고정폭 글꼴) 글꼴처럼 웹 브라우저에서 지정하는 generic-family 글꼴 입력
        Serif 글꼴: 끝이 뾰족한 글자
        Sans-serif 글꼴: 끝이 네모진 글자 -->
    <!-- HTML 페이지 p 태그 기본 크기는 16px로 32px(h1 태그)은 2em을 적용한 글자 크기가 같음. -->
     <style>
        .a { font-size: 32px; }
        .b { font-size: 2em; }
        .c { font-size: large; }
        .d { font-size: small; }
     </style>
</head>
<body>
    <h1>Lorem ipsum</h1>
    <p class="a">Lorem ipsum</p>
    <p class="b">Lorem ipsum</p>
    <p class="c">Lorem ipsum</p>
    <p class="d">Lorem ipsum</p>
</body>
</html>

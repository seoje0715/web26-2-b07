<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2. 가시 속성(2)</title>
    <style>
        #box {
            display: inline-block;
            background-color: red;
            width: 100px; height: 50px; /* inline 속성과 다르게 inline-block 속성은 width/height 속성 사용 가능 */
            margin: 10px;
        }
    </style>
</head>
<body>
    <p>의미 없는 더미 객체</p>
    <span>더미 객체</span>
    <div id="box">대상 객체</div>
    <span>더미 객체</span>
    <p>의미 없는 더미 객체</p>
</body>
</html>

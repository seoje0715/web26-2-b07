<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>7. 그림자와 그레이디언트 속성</title>
    <!-- text-shadow 속성: 글자에 그림자를 부여(오른쪽 아래 흐림도 색상)
        box-shadow 속성: 박스에 그림자를 부여(오른쪽 아래 흐림도 색상) -->
    <style>
        div {
            border: 3px solid black;
            box-shadow: 10px 10px 10px black, 10px 10px 20px orange, 10px 10px 30px red;
            text-shadow: 10px 10px 10px black, 10px 10px 20px orange, 10px 10px 30px red;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Lorem ipsum dolor amet</h1>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>반응.상태.구조 선택자</title>
    <!-- 1. 반응 선택자
        ':active': 사용자가 마우스로 클릭한 태그 선택
        ':hover': 사용자가 마우스 커서를 올린 태그 선택
        2. 상태 선택자
        ':checked': 체크 상태의 input 선택(type 속성이 checkbox 또는 radio인 input 태그가 선택된 상태)
        ':focus': 포커스를 맞춘 input 선택(사용자가 바로 입력할 수 있게 바가 깜박(포커스를 둔)거리는 상태, 웹 페이지당 input 하나에만 포커스 둘 수 O)
        ':enabled': 사용 가능한 input 선택(input 태그에 값 입력 가능한 상태) -> <input value="enabled">처럼 사용
        ':disabled': 사용 불가능한 input 선택(input 태그에 값 입력 불가능한 상태)
        3. 구조 선택자(수열의 결과 값에 해당하는 위치에 있는 태그에 스타일을 적용)
        ':first-child': 형제 관계에서 첫 번째로 등장하는 태그 선택
        ':last-child': 형제 관계에서 마지막으로 등장하는 태그 선택
        ':nth-child(수열)': 형제 관계에서 앞에서 수열 번째로 등장하는 태그 선택
        ':nth-last-child(수열)': 형제 관계에서 뒤에서 수열 번째로 등장하는 태그 선택 -->
    <style>
        h1:hover { color: red; }
        h1:active { color: blue; }

        input:enabled { background-color: white; }
        input:disabled { background-color: grey; }
        input:focus { background-color: orange; }

        ul { overflow: hidden; }
        li {
            list-style: none; /* list-style은 목록 앞 기호 설정, none으로 설정함으로써 기호 없이 목록 요소만 생성 */
            float: left; padding: 15px; /* float: left;가 ul, li를 가로로 나열로 디자인 */
        }
        li:first-child { border-radius: 10px 0 0 10px; } /* border-radius는 모서리를 둥글게 만드는 설정, 왼쪽 위부터 시계 방향으로 설정 */
        li:last-child { border-radius: 0 10px 10px 0; }
        li:nth-child(2n) { background-color: #FF0003; }
        li:nth-last-child(2n+1) { background-color: #800000; }
    </style>
</head>
<body>
    <h1>반응 선택자</h1><hr>

    <h1>상태 선택자</h1>
    <h2>사용 가능</h2>
    <input> <!-- 기본값이 text로 지정되고, HTML의 input은 기본적으로 사용 가능 상태이기 때문에 enable을 입력하지 X -->
    <h2>사용 불가능</h2>
    <input disabled="disabled"><hr> <!-- <input disabled>라고만 작성해도 O -->

    <h1>구조 선택자</h1>
    <ul>
        <li>첫 번째</li>
        <li>두 번째</li>
        <li>세 번째</li>
        <li>네 번째</li>
        <li>다섯 번째</li>
        <li>여섯 번째</li>
        <li>일곱 번째</li>
    </ul>
</body>
</html>

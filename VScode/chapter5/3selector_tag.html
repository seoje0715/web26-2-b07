<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2. 태그 선택자(기본) 사용</title>
    <style>
        h1 { color: red; }
        p { color: blue; }
    </style>
    <!-- 여러 선택자에 스타일 속성을 적용할 때는 쉼표(,) 사용
        ex. h1, p { color: red; } -->
</head>
<body>
    <h1>Newjeans</h1>
    <p>Newjeans is everywhere.</p>
</body>
</html>

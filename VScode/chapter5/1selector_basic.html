<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CSS3 selector Basic</title>
    <!-- 스타일시트: CSS로 작성된 코드
        CSS를 사용해 위치 지정, 색상 추가, 텍스트 이동, 블록 수준 요소에 대한 여백 및 테두리 설정 가능
        CSS3: 디자인 하고싶은 특정 HTML5 태그를 선택할 때 선택자 사용('선택자 { 스타일 속성 : 스타일 값; }' 형태로 사용)
        CSS는 헤드에 입력(사용자에게 직접 표시되지 않는 정보는 헤드에 직접 표시되는 정보는 바디에.)
        HTML은 코드를 위에서부터 읽기 때문에 헤드에 스타일시트를 작성하면 빠르게 디자인 적용 가능 -->
    <style>
        h1 {
            color: red;
            background-color: orange;
        }
    </style>
    <!-- CSS3 선택자 종류
        1. 전체 선택자: *
        2. 태그 선택자: 태그(ex. h1)
        3. 아이디 선택자: #아이디(ex. #id)
        4. 클래스 선택자: .클래스(ex. .header)
        5. 후손 선택자: 선택자 선택자(ex. header h1)
        6. 자손 선택자: 선택자 > 선택자(ex. header > h1)
        (':' 기호를 사용하는 선택자: 가상 클래스 선택자(pseudo-class selector) -> ex. 구조 선택자, 부정 선택자
        '::' 기호를 사용하는 선택자: 가상 요소 선택자(pseudo-element selector) -> ex. 문자 선택자) -->
</head>
<body>
    <h1>CSS3 선택자 기본</h1>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CSS3 URL 단위</title>
    <style>
        body {
            background-image: url('Desert.jpg');
        }
        /* 현재 폴더의 이미지 -> background-image: url('Desert.jpg')
            Other 폴더의 이미지 -> background-image: url('Other/Desert.jpg')
            루트 폴더의 이미지 -> background-image: url('/Desert.jpg') */
    </style>
</head>
<body>
    <h1>Lorem ipsum dolor amet.</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1. 전체 선택자(기본) 사용</title>
    <!-- 1. 전체 선택자: *(HTML 페이지 내부의 태그를 모두 선택)
        2. 태그 선택자: 태그(HTML 페이지 내부의 특정 태그를 모두 선택)
        3. 아이디 선택자: #아이디
                        (특정 id 속성이 있는 태그 선택, 웹 표준에 id 속성은 웹 페이지 내부에서 중복되면 안 된다는 규정이 있으므로
                        아이디 선택자는 특정 태그 하나를 선택할 때 사용)
        4. 클래스 선택자: .클래스(특정 클래스가 있는 태그 선택) -->
    <style>
        * { color: red; }
    </style>
</head>
<body>
    <h1>Newjeans</h1>
    <p>Newjeans is everywhere!</p>
</body>
</html>
